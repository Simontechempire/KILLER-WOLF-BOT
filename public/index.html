<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KILLER WOLF BOT - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a0000 0%, #000 70%);
      padding: 20px;
    }
    .banner-wrap {
      position: relative;
      width: 95%;
      max-width: 900px;
      margin-bottom: 30px;
    }
    .banner-wrap img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 30px;
      border: 3px solid #ff0000;
      box-shadow: 0 0 50px rgba(255,0,0,0.6), 0 0 100px rgba(255,0,0,0.2);
    }
    .glow {
      position: absolute;
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      border-radius: 35px;
      background: linear-gradient(45deg, #ff0000, #000, #ff0000);
      z-index: -1;
      filter: blur(20px);
      opacity: 0.5;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
      letter-spacing: 5px;
      margin: 20px 0 10px;
    }
    .subtitle {
      color: #888;
      font-size: 1.1rem;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 95%;
      max-width: 1000px;
      margin: 20px 0;
    }
    .card {
      background: linear-gradient(145deg, #111, #0a0a0a);
      border: 1px solid #222;
      border-left: 4px solid #ff0000;
      padding: 25px;
      border-radius: 15px;
      text-align: left;
      transition: 0.3s;
    }
    .card:hover {
      border-left: 4px solid #00ff00;
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(255,0,0,0.2);
    }
    .card h3 { color: #666; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 10px; }
    .card p { font-size: 1.6rem; font-weight: 700; color: #fff; }
    .card span { color: #00ff00; }
    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 15px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 2px;
      transition: 0.3s;
      border: 2px solid #ff0000;
    }
    .btn-red { background: #ff0000; color: #000; }
    .btn-black { background: transparent; color: #ff0000; }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #ff0000; }
    .footer { margin-top: 50px; color: #333; font-size: 0.8rem; letter-spacing: 2px; }
    @media(max-width: 600px) {
      h1 { font-size: 2rem; }
      .banner-wrap img { height: 220px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="banner-wrap">
      <div class="glow"></div>
      <img src="https://i.ibb.co/ynjDCV9L/killer-wolf.jpg" alt="KILLER WOLF BOT">
    </div>

    <h1>KILLER WOLF</h1>
    <p class="subtitle">SIMON TECH INC // SILENT WOLF EDITION</p>

    <div class="stats">
      <div class="card"><h3>STATUS</h3><p><span>● ONLINE</span></p></div>
      <div class="card"><h3>PREFIX</h3><p>/</p></div>
      <div class="card"><h3>COMMANDS</h3><p>100 PLUGINS</p></div>
      <div class="card"><h3>HOST</h3><p>RENDER</p></div>
      <div class="card"><h3>OWNER</h3><p style="font-size:1rem;">2349166265317</p></div>
      <div class="card"><h3>METHOD</h3><p>SILENT WOLF</p></div>
    </div>

    <div class="buttons">
      <a href="https://wa.me/2349166265317" class="btn btn-red">CONTACT OWNER</a>
      <a href="https://github.com" class="btn btn-black">GITHUB REPO</a>
    </div>

    <p class="footer">© 2026 KILLER WOLF BOT - POWERED BY SIMON TECH INC - ALL SYSTEMS OPERATIONAL</p>
  </div>
</body>
</html>
